; The pooler the application uses. ADR-008 requires transaction mode.
;
; In transaction mode a server connection is handed back to the pool at COMMIT,
; so a value set with SET LOCAL cannot outlive the transaction that set it.
; That is what makes `SET LOCAL app.user_id` a safe carrier for tenant identity.
;
; Note what this does NOT protect against: a plain `SET` without LOCAL is a
; session-level change, and in transaction mode pgbouncer does not run a reset
; query, so such a value can survive on the server connection and be observed
; by a different client. The codebase therefore uses SET LOCAL exclusively, and
; a test scans the source to keep it that way.

[databases]
ledger = host=postgres port=5432 dbname=ledger
ledger_test = host=postgres port=5432 dbname=ledger_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

; Must be empty under transaction pooling. See the pgbouncer documentation:
; a reset query here would run on a connection that may be mid-use by design.
server_reset_query =
server_reset_query_always = 0

max_client_conn = 200
default_pool_size = 20
min_pool_size = 2

; asyncpg sends these on connect. Without ignoring them pgbouncer refuses the
; startup packet and the failure reads like an authentication problem.
ignore_startup_parameters = extra_float_digits,options,search_path

admin_users = ledger_app
stats_users = ledger_app

log_connections = 0
log_disconnections = 0
