; DELIBERATELY MISCONFIGURED. This is a test fixture, not a second pooler.
;
; Nothing in the application may point at port 6433. It exists so that the
; security suite can demonstrate, rather than merely assert, what session-mode
; pooling does: a server connection is pinned to one client for the client's
; whole life, so session-level state set by one request is still there for the
; next request on that connection.
;
; ADR-008 names this as the failure that turns tenant isolation into a
; cross-tenant leak. A rule that is only written down decays. A rule with a
; reachable endpoint proving it can be exercised, and the test that uses this
; file fails loudly if the behaviour ever changes.

[databases]
ledger = host=postgres port=5432 dbname=ledger
ledger_test = host=postgres port=5432 dbname=ledger_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = session

max_client_conn = 200
default_pool_size = 20

ignore_startup_parameters = extra_float_digits,options,search_path

admin_users = ledger_app
stats_users = ledger_app
