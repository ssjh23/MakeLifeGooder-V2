[project]
name = "ledger"
version = "0.1.0"
description = "Bank statement classifier for Singapore"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Alembic runs synchronously as the migration role.
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # EmailStr (app/schemas/auth.py) validates through this at import time,
    # not lazily, so it is a real dependency rather than an optional extra.
    "email-validator>=2.2",
    "procrastinate>=3.0",
    "boto3>=1.35",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "anthropic>=0.39",
    # OIDC (ADR-008): the Authorization Code + PKCE dance against Auth0. Used
    # only to acquire the ID token at /auth/oidc/callback; the session that
    # follows is the same SessionCodec cookie password login issues, so the
    # SDK's own session store is never read back (see app/api/oidc.py).
    "auth0-server-python>=1.0.0b1",
    # The primary parser (ADR-001): bank detection and per-bank extraction.
    # Pulls system packages (poppler) that need a matching-architecture
    # toolchain to build against; see "Things that look like details and are
    # not" in CLAUDE.md if `import monopoly` fails at runtime.
    "monopoly-core>=0.21",
    # The documented AGPL exit (ADR-013) and the adapter contract's second
    # implementation. Not wired into the default registry (ADR-001 rejects a
    # PDF outright when Monopoly does not support the bank), but kept real and
    # tested so dropping monopoly-core stays a live option.
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # Used only to generate the four failure-shape fixture PDFs.
    "reportlab>=4.2",
    "pypdf>=5.1",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    # Signatures that intentionally raise NotImplementedError have unused args.
    "ARG001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/*" = ["E501"]

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "procrastinate.*",
    "pdfplumber.*",
    "monopoly.*",
    "boto3.*",
    "botocore.*",
    "auth0_server_python.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `get_engine()` / `get_sessionmaker()` (app/api/deps.py) are `@lru_cache`d,
# a single asyncpg pool for the process's life -- correct for the app, which
# only ever runs one event loop. pytest-asyncio's default is a fresh loop per
# test, so a connection checked out on test N's loop gets used again on test
# N+1's *different* loop and asyncpg raises "attached to a different loop" or
# "Event loop is closed", nondeterministically, well after the failing test.
# One event loop for the whole run keeps that pool's lifetime assumption true
# in tests too.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "p0: blocks release. Data integrity, money correctness, tenant isolation or privacy",
    "p1: core function. The feature is unusable or visibly wrong without it",
    "p2: edge case, polish, or recoverable inconvenience",
    "security: isolation, redaction and credential handling",
    "integration: needs docker compose running",
    "slow: excluded from the default loop",
    "unwritten: logic Sean has not written yet. Expected to fail until he does",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
