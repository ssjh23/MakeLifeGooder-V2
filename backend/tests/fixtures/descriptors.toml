# The normaliser's fixture corpus.
#
# A pure function with a table of cases is the cheapest test in the codebase:
# no database, no PDF, no fixtures directory, milliseconds to run. It is also
# the one place that records what "the same merchant" actually means, which is
# a judgment call rather than a fact.
#
# Add a row every time a real statement produces something these rules get
# wrong. That is the intended way for this file to grow: from data, not from
# imagination.

[[case]]
raw = "MCDONALDS-JUNCTION8"
key = "mcdonalds"
why = "The stated pain point. Outlet suffix after a hyphen."

[[case]]
raw = "MCDONALDS (CCP)"
key = "mcdonalds"
why = "Same merchant, outlet code in brackets."

[[case]]
raw = "McDonald's"
key = "mcdonalds"
why = "Casing and an apostrophe must not create a second merchant."

[[case]]
raw = "NTUC FAIRPRICE FINEST NEX"
key = "fairprice"
why = "Chain name plus format plus mall. Only the chain survives."

[[case]]
raw = "FAIRPRICE XPRESS TAMPINES"
key = "fairprice"
why = "Different format of the same chain."

[[case]]
raw = "GRAB *TRANSPORT SG"
key = "grab"
why = "Processor asterisk and a country suffix."

[[case]]
raw = "GRABFOOD"
key = "grabfood"
why = "Deliberately NOT grab. Different spending category, so keeping them apart matters more than tidiness."

[[case]]
raw = "SHELL SERVICE STATION 12"
key = "shell"
why = "Trailing station number is an outlet, not a merchant."

[[case]]
raw = "AMAZON.SG"
key = "amazon"
why = "Country domain suffix."

[[case]]
raw = "PAYNOW TRANSFER TO TAN AH KOW"
key = ""
why = "Excluded by the transfer filter before it reaches the normaliser. An empty key here means it must never become a merchant."

[[case]]
raw = "SINGTEL BILL PAYMENT 8842"
key = "singtel"
why = "Trailing reference number."

[[case]]
raw = "7-ELEVEN 2245"
key = "7-eleven"
why = "A digit and hyphen are part of the name here, not noise. The hard case for an aggressive rule."

[[case]]
raw = "BUS/MRT 765695553 SINGAPORE Ref No. : 7454183536288096046025"
key = "bus mrt"
why = "Transit statement line: a fresh per-ride id printed mid-descriptor, between the marker and the words that follow it, not at the end -- TRAILING_NOISE alone never reaches it. Every ride must converge to one key, or every tap becomes a new merchant. 'Singapore' immediately before 'Ref No.' is settlement-country boilerplate, not part of the name, so it goes with the reference."

[[case]]
raw = "BUS/MRT 764142284 SINGAPORE Ref No. : 7454183536288083715296"
key = "bus mrt"
why = "A second ride, different ride id and reference number, same merchant -- must match the case above exactly."

[[case]]
raw = "7-ELEVEN-1 CHANGI BIZ PK Singapore Ref No. : 74556225356107698754792"
key = "7-eleven-1 changi biz pk"
why = "A general 'Ref No.' field, distinct from the transit id above: it trails many different merchants' lines, always as a bank-assigned reference, never part of any merchant's own identity. 'Singapore' directly in front of it is stripped with it, same reasoning as the transit case."

[[case]]
raw = "SHABUSAI - CHANGI CITY POINT Singapore Ref No. : 74508985350022554012512"
key = "shabusai changi city point"
why = "Same 'Ref No.' field on an unrelated merchant, confirming the rule is general rather than tied to one marker."

[[case]]
raw = "SHABUSAI - CHANGI CITY POINT Singapore Ref No. : 99912345678900000000001"
key = "shabusai changi city point"
why = "Same merchant, a totally different reference number -- must converge to the same key as the case above, or every occurrence of a repeat merchant looks like a new one."
